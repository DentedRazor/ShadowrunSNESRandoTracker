<!--Shadowrun Randomizer Tracker v0.2

Written by: DentedRazor
Date: 2026-10-11

Description: Basic webpage in HTML & CSS with
             buttons to click and toggle for 
			 tracking which Key Words and Key Items
			 the player has gained.
			 
			 Edit the variables in the :root class to customize
			 colors and font. Edit the names in the table section
			 of the body code.
			 
			 Note that the color #000129 is the background color
			 of the in-game menu of Shadowrun (SNES).

Special Thanks: To Osteoclave for creating this Randomizer and
				to the Shadowrun Speedrun Community for their
				feedback during its creation and updates.
-->

<html>
<head>
<style>
@font-face {
	font-family: "Steelflight";
	src:url("Steelflight.ttf");
}
:root{
	--main-font: Steelflight;
	--main-border-color: white;
	--main-bg-color: #000129;
    --main-color: white;
	--toggled-color: #000129;
	--toggled-bg-color: white;
}
body{
	background-color: var(--main-bg-color);
}
th{
	color: var(--main-color);
}
table{
	display: flex;
	width: 434px;
	border: 1px solid;
	color: var(--main-border-color);
	font-family: var(--main-font);
	height: auto;	
}
td{
	border: 1px solid;
	text-align:center;
}

input{
	display: none;	
}
input:checked+label {
	display: block;
	background-color: var(--toggled-bg-color);
	color: var(--toggled-color);
	width: 100%;
	height: 100%;
}
input+label{
	display: block;
	color: var(--main-color);
	width: 100%;
	height: 100%;
}
.blankRow{
	height: 20px;
}
.blankCell{
	border: none;
}
</style>
</head>
<body>
<table>
  <tr>
    <th>Key Words:</th>
    <td><input type="checkbox" id="Keyword2"><label for="Keyword2">Dog</td>
	<td><input type="checkbox" id="Keyword4"><label for="Keyword4">Laughlyn</td>	
  </tr>
  <tr>
    <td><input type="checkbox" id="Keyword1"><label for="Keyword1">Bremerton</td>
	<td><input type="checkbox" id="Keyword3"><label for="Keyword3">Jester Spirit</td>
	<td><input type="checkbox" id="Keyword5"><label for="Keyword5">Volcano</td>
  </tr>
  <tr class="blankRow">
	<td class="blankCell" colspan="3"></td>
  </tr>
  <tr>	
  <!-- Key Items Declaration -->
    <th>Key Items:</th>
	<td><input type="checkbox" id="Keyitem7"><label for="Keyitem7">Door Key</td>
	<td><input type="checkbox" id="Keyitem14"><label for="Keyitem14">Magic Fetish</td>    
  </tr>
  <tr>
    <td><input type="checkbox" id="Keyitem1"><label for="Keyitem1">Bronze Key</td> 	
    <td><input type="checkbox" id="Keyitem8"><label for="Keyitem8">Explosives</td>
	<td><input type="checkbox" id="Keyitem15"><label for="Keyitem15">Ripped Note</td>			
  </tr>
  <tr>
	<td><input type="checkbox" id="Keyitem2"><label for="Keyitem2">Credstick</td>
    <td><input type="checkbox" id="Keyitem9"><label for="Keyitem9">Green Bottle</td>
	<td><input type="checkbox" id="Keyitem16"><label for="Keyitem16">Scalpel</td>	
  </tr>
  <tr>
	<td><input type="checkbox" id="Keyitem3"><label for="Keyitem3">Crowbar</td>
	<td><input type="checkbox" id="Keyitem10"><label for="Keyitem10">Iced Tea</td>
	<td><input type="checkbox" id="Keyitem17"><label for="Keyitem17">Shades</td>	
  </tr>
  <tr>
	<td><input type="checkbox" id="Keyitem4"><label for="Keyitem4">Cyberdeck</td>
	<td><input type="checkbox" id="Keyitem11"><label for="Keyitem11">Iron Key</td>
	<td><input type="checkbox" id="Keyitem18"><label for="Keyitem18">Stake</td>
  </tr>
  <tr>
	<td><input type="checkbox" id="Keyitem5"><label for="Keyitem5">Detonator</td>  
    <td><input type="checkbox" id="Keyitem12"><label for="Keyitem12">Jester Spirit</td>
	<td><input type="checkbox" id="Keyitem19"><label for="Keyitem19">Tickets</td>		
  </tr>
  <tr>
	<td><input type="checkbox" id="Keyitem6"><label for="Keyitem6">Dog Collar</td> 
	<td><input type="checkbox" id="Keyitem13"><label for="Keyitem13">Lonestar Badge</td>
  </tr>
</table>
</body>
</html>
